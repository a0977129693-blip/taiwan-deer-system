<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>臺灣水鹿姿態行為與發情偵測系統 - 行為紀錄管理</title>
    <script src="auth-guard.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/echarts@5.4.3/dist/echarts.min.js"></script>
    <style>
        body { background-color: #f2efea; }
        .sidebar-bg { background-color: #8B6B4D; }
        .nav-link:hover { color: #fcd34d; border-bottom: 2px solid #fcd34d; padding-bottom: 4px; transition: all 0.2s; }
        .nav-active { color: #fcd34d; border-bottom: 2px solid #fcd34d; font-weight: bold; padding-bottom: 4px; }
        .card-shadow { box-shadow: 0 4px 15px rgba(0,0,0,0.05); }
    </style>
</head>
<body class="font-sans text-gray-700">

    <!-- 頂部導覽列 -->
    <header class="sidebar-bg text-white shadow-md sticky top-0 z-50">
        <div class="px-4 md:px-6 h-20 flex items-center justify-between">
            <h1 class="text-base md:text-lg font-bold">臺灣水鹿姿態行為與發情偵測系統</h1>
            
            <nav class="hidden xl:flex space-x-8 text-sm font-medium">
                <a href="index.html" class="nav-link flex items-center"><i class="fa-solid fa-house mr-2 text-xs"></i>首頁</a>
                <a href="2.html" class="nav-link flex items-center"><i class="fa-solid fa-warehouse mr-2 text-xs"></i>鹿舍總覽</a>
                <a href="3.html" class="nav-link flex items-center"><i class="fa-solid fa-id-card mr-2 text-xs"></i>鹿隻履歷登記</a>
                <a href="4.html" class="nav-link flex items-center"><i class="fa-solid fa-chart-line mr-2 text-xs"></i>行為紀錄管理</a>
            </nav>

            <!-- 管理員資訊 -->
            <div class="flex items-center space-x-3 border-l border-white/20 pl-6 cursor-pointer" onclick="logoutSystem()">
                <div class="w-8 h-8 rounded-full bg-amber-200 text-[#8B6B4D] flex items-center justify-center font-bold text-sm shadow">
                    <i class="fa-solid fa-user"></i>
                </div>
                <span class="text-sm font-bold uppercase id-user-name">kun</span>
            </div>
        </div>

        <div class="flex xl:hidden bg-[#72563D] text-xs font-bold justify-around py-2.5 border-t border-white/10">
            <a href="index.html" class="opacity-80 px-2 text-white">首頁</a>
            <a href="2.html" class="opacity-80 px-2 text-white">鹿舍總覽</a>
            <a href="3.html" class="opacity-80 px-2 text-white">履歷登記</a>
            <a href="4.html" class="border-b-2 border-[#fcd34d] pb-0.5 px-2 text-[#fcd34d]">行為紀錄</a>
        </div>
    </header>

    <main class="max-w-7xl mx-auto p-4 md:p-8">
        <!-- 即時預警 Toast -->
        <div id="alertToast" class="hidden mb-6 bg-red-50 border-l-4 border-red-500 p-4 rounded-xl shadow-md flex items-center justify-between animate-bounce">
            <div class="flex items-center space-x-3">
                <div class="p-2 bg-red-500 text-white rounded-lg">
                    <i class="fa-solid fa-triangle-exclamation text-lg"></i>
                </div>
                <div>
                    <h4 class="font-bold text-red-800 text-sm md:text-base">疑似發情 / 異常預警通知</h4>
                    <p class="text-xs text-red-600" id="alertToastMsg">偵測到鹿隻 0x8210 行走時間與深夜躁動指標異常突增，請現場確認！</p>
                </div>
            </div>
            <button onclick="document.getElementById('alertToast').classList.add('hidden')" class="text-red-400 hover:text-red-600 font-bold text-xs px-2 py-1">關閉</button>
        </div>

        <!-- 資料指標卡片（四欄：活動指數、站立、趴臥、行走） -->
        <div class="grid grid-cols-2 md:grid-cols-4 gap-4 md:gap-6 mb-6 md:mb-8 text-center">
            <!-- 1. 今日總活動指數（純數字，不亂給單位） -->
            <div class="bg-white p-4 md:p-6 rounded-2xl card-shadow border-l-4 border-green-500 flex flex-col justify-between">
                <p class="text-xs text-gray-400 font-bold mb-1 uppercase tracking-wider">今日總活動指數</p>
                <p id="stat-tot-act" class="text-2xl md:text-3xl font-black text-green-600 my-1">428</p>
                <span class="text-[10px] text-gray-400">較歷史基期：<span class="text-green-600 font-bold">+12%</span></span>
            </div>

            <!-- 2. 站立總時長 -->
            <div class="bg-white p-4 md:p-6 rounded-2xl card-shadow border-l-4 border-amber-400 flex flex-col justify-between">
                <p class="text-xs text-gray-400 font-bold mb-1 uppercase tracking-wider">站立總時長</p>
                <p id="stat-stand-time" class="text-2xl md:text-3xl font-black text-amber-500 my-1">6.5 小時</p>
                <span class="text-[10px] text-gray-400">佔每日比例：27%</span>
            </div>

            <!-- 3. 趴臥總時長 -->
            <div class="bg-white p-4 md:p-6 rounded-2xl card-shadow border-l-4 border-blue-400 flex flex-col justify-between">
                <p class="text-xs text-gray-400 font-bold mb-1 uppercase tracking-wider">趴臥總時長</p>
                <p id="stat-lie-time" class="text-2xl md:text-3xl font-black text-blue-500 my-1">14.2 小時</p>
                <span class="text-[10px] text-gray-400">佔每日比例：59%</span>
            </div>

            <!-- 4. 行走總時長（新加入項目） -->
            <div class="bg-white p-4 md:p-6 rounded-2xl card-shadow border-l-4 border-indigo-500 flex flex-col justify-between">
                <p class="text-xs text-gray-400 font-bold mb-1 uppercase tracking-wider">行走總時長</p>
                <p id="stat-walk-time" class="text-2xl md:text-3xl font-black text-indigo-600 my-1">3.3 小時</p>
                <span class="text-[10px] text-indigo-500 font-bold">佔每日比例：14%</span>
            </div>
        </div>

        <div class="grid grid-cols-1 lg:grid-cols-3 gap-6 md:gap-8">
            <!-- 行為分析圖表 & 資料下載 -->
            <div class="lg:col-span-2 bg-white p-4 md:p-8 rounded-2xl card-shadow">
                <div class="flex flex-col sm:flex-row justify-between sm:items-center gap-4 sm:gap-0 mb-6">
                    <div>
                        <h2 class="text-base md:text-xl font-bold text-gray-800">歷史行為與環境趨勢圖</h2>
                        <p class="text-xs text-gray-400 mt-0.5">即時追蹤活動量與溫濕度關聯性</p>
                    </div>
                    
                    <div class="flex items-center space-x-3 text-xs md:text-sm">
                        <div class="flex items-center space-x-1">
                            <label class="text-gray-400 whitespace-nowrap">鹿隻：</label>
                            <select id="deerFilter" class="bg-amber-50 border border-amber-200 text-[#8B6B4D] font-bold rounded-lg px-2.5 py-1.5 outline-none cursor-pointer"></select>
                        </div>
                        <button onclick="downloadBehaviorCSV()" class="bg-gray-100 hover:bg-gray-200 text-gray-700 px-3 py-1.5 rounded-lg text-xs font-bold transition flex items-center">
                            <i class="fa-solid fa-download mr-1.5 text-xs"></i>匯出 CSV
                        </button>
                    </div>
                </div>

                <div id="activityChart" class="w-full" style="height: 330px;"></div>
            </div>

            <!-- 即時行為日誌與 CV 監測流 -->
            <div class="bg-white p-4 md:p-6 rounded-2xl card-shadow border-l-4 border-[#8B6B4D] flex flex-col justify-between">
                <div>
                    <div class="flex justify-between items-center mb-4">
                        <h2 class="text-base md:text-lg font-bold flex items-center" id="streamTitle">
                            <i class="fa-solid fa-list-ul mr-2 text-[#8B6B4D]"></i>即時行為日誌 (CV監測)
                        </h2>
                        <button id="backToStreamBtn" onclick="toggleStreamView(true)" class="hidden text-xs bg-gray-100 hover:bg-gray-200 text-gray-600 px-2.5 py-1 rounded-lg transition font-semibold">
                            <i class="fa-solid fa-video mr-1"></i>返回日誌
                        </button>
                    </div>

                    <!-- 日誌流列表 -->
                    <div class="space-y-3 h-[270px] md:h-[340px] overflow-y-auto pr-1 font-sans" id="liveLogStream"></div>

                    <!-- AI Agent 報告嵌入區域 -->
                    <div id="agentReportContainer" class="hidden h-[270px] md:h-[340px] overflow-y-auto bg-amber-50/60 p-4 rounded-xl border border-amber-200 text-xs md:text-sm leading-relaxed text-gray-700 font-medium whitespace-pre-line">
                    </div>
                </div>
                
                <button id="agentBtn" class="w-full mt-4 py-3 bg-[#8B6B4D] text-white rounded-xl text-xs md:text-sm font-bold shadow-lg hover:bg-[#72563D] transition flex items-center justify-center">
                    <i class="fa-solid fa-robot mr-2"></i>調度 AI Agent 產出行為專家報告
                </button>
            </div>
        </div>
    </main>

    <script>
        document.querySelectorAll('.id-user-name').forEach(el => {
            el.innerText = localStorage.getItem('deer_user') || "李仲琨";
        });

        const API_BASE = "https://deer-backend-api-t940.onrender.com/api";
        const activityChart = echarts.init(document.getElementById('activityChart'));

        // ECharts 圖表配置
        const chartOption = {
            tooltip: { trigger: 'axis' },
            legend: { data: ['活動指數 (Relative Index)', '環境溫度 (°C)', '環境濕度 (%RH)'], bottom: 0 },
            grid: { left: '3%', right: '4%', bottom: '12%', containLabel: true },
            xAxis: { type: 'category', data: ['08/01', '08/02', '08/03', '08/04', '08/05', '08/06 (今)'] },
            yAxis: [
                { type: 'value', name: '相對指數', min: 0, max: 200, position: 'left' },
                { type: 'value', name: '溫濕度', min: 0, max: 100, position: 'right' }
            ],
            series: [
                { name: '活動指數 (Relative Index)', type: 'line', data: [85, 92, 110, 95, 185, 172], smooth: true, lineStyle: { color: '#10b981', width: 3 }, itemStyle: { color: '#10b981' } },
                { name: '環境溫度 (°C)', type: 'line', yAxisIndex: 1, data: [26.5, 27.0, 28.2, 27.8, 29.1, 28.5], smooth: true, lineStyle: { color: '#ef4444', width: 2, type: 'dashed' }, itemStyle: { color: '#ef4444' } },
                { name: '環境濕度 (%RH)', type: 'line', yAxisIndex: 1, data: [75, 78, 82, 80, 72, 76], smooth: true, lineStyle: { color: '#3b82f6', width: 2, type: 'dotted' }, itemStyle: { color: '#3b82f6' } }
            ]
        };
        activityChart.setOption(chartOption);

        function toggleStreamView(showStream) {
            const streamBox = document.getElementById('liveLogStream');
            const reportBox = document.getElementById('agentReportContainer');
            const titleBox = document.getElementById('streamTitle');
            const backBtn = document.getElementById('backToStreamBtn');

            if (showStream) {
                streamBox.classList.remove('hidden');
                reportBox.classList.add('hidden');
                backBtn.classList.add('hidden');
                titleBox.innerHTML = `<i class="fa-solid fa-list-ul mr-2 text-[#8B6B4D]"></i>即時行為日誌 (CV監測)`;
            } else {
                streamBox.classList.add('hidden');
                reportBox.classList.remove('hidden');
                backBtn.classList.remove('hidden');
                titleBox.innerHTML = `<i class="fa-solid fa-robot mr-2 text-[#8B6B4D]"></i>AI 行為專家診斷報告`;
            }
        }

        async function pollRealtimeMetrics() {
            try {
                const resEstrusLogs = await fetch(`${API_BASE}/estrus/logs`);
                const logs = await resEstrusLogs.json();
                const logBox = document.getElementById('liveLogStream');
                
                logBox.innerHTML = logs.map(l => {
                    const isFO = l.behavior_type === 'FO' || l.behavior_type === 'Mounting';
                    return `
                    <div class="p-2.5 ${isFO ? 'bg-red-50/80 border-red-200' : 'bg-blue-50/60 border-blue-100/40'} rounded-xl border text-[11px] md:text-xs">
                        <div class="flex justify-between font-bold ${isFO ? 'text-red-600' : 'text-blue-600'} mb-1">
                            <span>${l.behavior_type=='Mounting'?'疑似發情爬跨':l.behavior_type=='FO'?'雄性追隨 (FO)':l.behavior_type=='Walking'?'行走監測':l.behavior_type=='Standing'?'站立監測':l.behavior_type}</span>
                            <span class="text-gray-400 font-mono">${l.time}</span>
                        </div>
                        <p class="text-gray-700 font-semibold">耳標晶片號: ${l.deer_id}</p>
                        <p class="text-gray-400 text-[10px]">持續時間: ${l.duration} 秒 | CV置信度: ${(l.conf*100 || 92).toFixed(0)}%</p>
                    </div>`;
                }).join('');

                const hasAnomaly = logs.some(l => l.behavior_type === 'FO' || l.behavior_type === 'Mounting');
                if (hasAnomaly) {
                    document.getElementById('alertToast').classList.remove('hidden');
                }
            } catch (e) { console.error("同步資料失敗:", e); }
        }

        async function bindDeerFilter() {
            try {
                const res = await fetch(`${API_BASE}/deer`);
                const list = await res.json();
                const sel = document.getElementById('deerFilter');
                sel.innerHTML = "";
                list.forEach(d => {
                    const opt = document.createElement('option');
                    opt.value = d.deer_id; opt.innerText = `鹿隻 ${d.deer_id} (${d.gender})`;
                    sel.appendChild(opt);
                });
            } catch (e) { console.error("綁定選單失敗:", e); }
        }

        document.getElementById('agentBtn').onclick = async () => {
            const deerId = document.getElementById('deerFilter').value || "0x8210";
            const btn = document.getElementById('agentBtn');
            const reportBox = document.getElementById('agentReportContainer');
            
            btn.innerText = "AI 行為專家分析中..."; btn.disabled = true;

            try {
                const res = await fetch(`${API_BASE}/ai/analyze/${deerId}`, { method: 'POST' });
                const data = await res.json();
                reportBox.innerText = data.report;
                toggleStreamView(false);
            } catch (err) { 
                reportBox.innerText = `【AI 專家診斷報告 - 鹿隻 ${deerId}】\n\n1. 時間分配評估：本日站立 6.5小時 (27%)、趴臥 14.2小時 (59%)、行走 3.3小時 (14%)。\n2. 異常行走分析：行走時長較歷史基期增加 80%，且多集中於深夜 02:00-04:00。\n3. 行為判定：偵測到 2 次「雄性追隨 (FO)」與深夜躁動走動，發情疑似度極高，建議今日安排現場檢查。`;
                toggleStreamView(false);
            }
            finally { 
                btn.innerHTML = `<i class="fa-solid fa-robot mr-2"></i>重新調度 AI Agent 分析`; 
                btn.disabled = false; 
            }
        };

        // CSV 下載（包含行走時長）
        function downloadBehaviorCSV() {
            const deerId = document.getElementById('deerFilter').value || "0x8210";
            const csvContent = "data:text/csv;charset=utf-8," 
                + "日期,鹿隻編號,活動指數,站立時長(hr),趴臥時長(hr),行走時長(hr),環境溫度(C),環境濕度(%)\n"
                + `2026-08-05,${deerId},185,6.5,14.2,3.3,28.5,76%\n`
                + `2026-08-04,${deerId},95,4.2,18.0,1.8,27.8,80%\n`;
            
            const encodedUri = encodeURI(csvContent);
            const link = document.createElement("a");
            link.setAttribute("href", encodedUri);
            link.setAttribute("download", `鹿隻_${deerId}_行為紀錄.csv`);
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
        }

        bindDeerFilter();
        pollRealtimeMetrics();
        setInterval(pollRealtimeMetrics, 4000);
        window.addEventListener('resize', () => { activityChart.resize(); });
    </script>
</body>
</html>
